<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Product Display Lab</h1>
      <p>Plain HTML + CSS + JavaScript API exploration page</p>
    </header>

    <main class="container">
      <section class="panel">
        <h2>Featured Product Tile</h2>
        <article class="product-tile" id="productTile">
          <span class="chip" id="productCategory">Category</span>
          <h3 id="productName">Waiting for API data...</h3>
          <p id="productDescription">Product description will show here.</p>
          <div class="meta-row">
            <strong id="productPrice">$0.00</strong>
            <span id="productBrand">Brand</span>
          </div>
          <p class="stock" id="productQuantity">Qty: 0</p>
        </article>

        <div class="actions">
          <button id="refreshBtn" type="button">Refresh Products</button>
          <span id="statusText">Ready.</span>
        </div>
      </section>

      <section class="panel">
        <h2>Full Product List</h2>
        <div class="product-list" id="productList"></div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
